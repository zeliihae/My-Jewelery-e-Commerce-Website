<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Detayı | Jewelry Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            margin: 20px;
            background: #8B2F39;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .back-button:hover {
            background: #6d2329;
            transform: translateX(-5px);
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
        }

        .product-gallery {
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .main-image-wrapper {
            position: relative;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .main-image {
            width: 100%;
            height: 500px;
            object-fit: contain;
            border-radius: 10px;
            transition: transform 0.3s;
        }

       

        .favorite-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            z-index: 10;
        }

        .favorite-badge:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .favorite-badge i {
            font-size: 24px;
            color: #8B2F39;
        }

        .favorite-badge.active i {
            animation: heartBeat 0.5s;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
        }

        .discount-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(255,107,107,0.3);
        }

        .product-info {
            padding: 20px 0;
        }

        .product-category {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 36px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .stars {
            color: #ffc107;
            font-size: 18px;
        }

        .rating-text {
            color: #718096;
            font-size: 14px;
        }

        .price-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .price-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .current-price {
            font-size: 42px;
            font-weight: 800;
            color: #8B2F39;
        }

        .old-price {
            font-size: 24px;
            color: #a0aec0;
            text-decoration: line-through;
        }

        .savings {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .stock-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .stock-status.in-stock {
            background: #d4edda;
            color: #155724;
        }

        .stock-status.out-stock {
            background: #f8d7da;
            color: #721c24;
        }

        .product-description {
            color: #4a5568;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
            border-left: 4px solid #8B2F39;
        }

        .quantity-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .quantity-btn {
            width: 45px;
            height: 45px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            color: #8B2F39;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
#starRating i.active { color: #ffc107 !important; }
#starRating i:hover { color: #ffc107; }
        .quantity-btn:hover:not(:disabled) {
            background: #8B2F39;
            color: white;
            border-color: #8B2F39;
            transform: scale(1.1);
        }

        .quantity-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .quantity-display {
            font-size: 24px;
            font-weight: 700;
            color: #2d3748;
            min-width: 50px;
            text-align: center;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            flex: 1;
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8B2F39 0%, #6d2329 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(139,47,57,0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139,47,57,0.4);
        }


        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .product-features {
            background: #f7fafc;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }

        .feature-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #8B2F39 0%, #6d2329 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .feature-text {
            font-size: 14px;
            color: #4a5568;
            font-weight: 500;
        }

        .loading-skeleton {
            animation: shimmer 2s infinite;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 968px) {
            .product-detail {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .product-gallery {
                position: static;
            }

            .main-image {
                height: 400px;
            }

            .product-title {
                font-size: 28px;
            }

            .current-price {
                font-size: 32px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="javascript:history.back()" class="back-button">
            <i class="fas fa-arrow-left"></i>
            Geri Dön
        </a>

        <div class="product-detail" id="productDetail">
            <div class="loading-skeleton" style="height: 600px; border-radius: 15px;"></div>
        </div>
    </div>
<section class="reviews-section" style="padding: 40px; border-top: 1px solid #eee;">
    <h2 style="margin-bottom: 30px; color: #2d3748;">Customer Reviews</h2>
    
    <div class="review-form" id="reviewFormContainer" style="background: #f8f9fa; padding: 25px; border-radius: 15px; margin-bottom: 40px;">
        <h3 style="font-size: 18px; margin-bottom: 15px;">Write a Review</h3>
        <div class="rating-input" style="margin-bottom: 15px;">
            <label>Your Rating: </label>
            <div id="starRating" style="display: inline-block; font-size: 24px; color: #ddd; cursor: pointer;">
                <i class="far fa-star" data-value="1"></i>
                <i class="far fa-star" data-value="2"></i>
                <i class="far fa-star" data-value="3"></i>
                <i class="far fa-star" data-value="4"></i>
                <i class="far fa-star" data-value="5"></i>
            </div>
            <input type="hidden" id="selectedRating" value="0">
        </div>
        <textarea id="reviewComment" placeholder="Share your thoughts about this product..." style="width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 10px; height: 100px; margin-bottom: 15px; font-family: inherit;"></textarea>
        <button class="btn btn-primary" onclick="submitReview()" style="width: auto;">Submit Review</button>
    </div>

    <div id="reviewsList">
        <p style="color: #718096;">Loading reviews...</p>
    </div>
</section>
 

<script src="script.js"></script>
<script src="product-detail.js"></script>

    
    </script>
</body>
</html>
