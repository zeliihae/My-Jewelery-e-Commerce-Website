<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Kayıt Ol - Jewelry Shop</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-gem"></i>
                    <h1>Jewelry Shop</h1>
                </div>
                <h2>Hesap Oluştur</h2>
                <p>Hemen ücretsiz hesap oluşturun</p>
            </div>

            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Ad Soyad</label>
                    <input type="text" id="fullName" placeholder="Ad ve Soyadınız" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> E-posta</label>
                    <input type="email" id="email" placeholder="ornek@email.com" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Telefon</label>
                    <input type="tel" id="phone" placeholder="05xx xxx xx xx" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Şifre</label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Şifreniz" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Şifre Tekrar</label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" placeholder="Şifrenizi tekrar girin" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group checkbox">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        <a href="#">Kullanım Koşulları</a> ve <a href="#">Gizlilik Politikası</a>'nı okudum ve kabul ediyorum
                    </label>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-user-plus"></i> Kayıt Ol
                </button>

                <div class="divider">
                    <span>veya</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn-social google">
                        <i class="fab fa-google"></i> Google ile Kayıt Ol
                    </button>
                    <button type="button" class="btn-social facebook">
                        <i class="fab fa-facebook-f"></i> Facebook ile Kayıt Ol
                    </button>
                </div>

                <div class="auth-footer">
                    <p>Zaten hesabınız var mı? <a href="Login.html">Giriş Yapın</a></p>
                </div>
            </form>
        </div>

        <div class="auth-image">
            <div class="overlay">
                <h2>Hoş Geldiniz!</h2>
                <p>En kaliteli takılar için doğru yerdesiniz. Hemen hesap oluşturun ve özel fırsatlardan yararlanın!</p>
                <div class="features">
                    <div class="feature">
                        <i class="fas fa-shipping-fast"></i>
                        <span>Hızlı Kargo</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-shield-alt"></i>
                        <span>Güvenli Ödeme</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-certificate"></i>
                        <span>Garantili Ürünler</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
